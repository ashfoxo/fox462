<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Health</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #@bg@; --surf: #@surf@; --line: #@line@;
    --fg: #@fg@; --dim: #@dim@; --faint: #@faint@;
    --accent: #@accent@; --teal: #@teal@; --rust: #@rust@; --amber: #@amber@;
    --violet: #b39ce8; --pink: #e58fb4;
    --good: var(--accent); --bad: var(--rust);
    --deep: #3987e5; --rem: #d95926; --light: #199e70; --awake: #c98500;
    /* Heart-rate zones: one blue, dark (warm-up) to light (maximum). */
    --z1: #1c5cab; --z2: #2a78d6; --z3: #5598e7; --z4: #86b6ef; --z5: #b7d3f6;
    --r: 14px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, sans-serif;
    font-variant-numeric: tabular-nums; }
  main { max-width: 1180px; margin: 0 auto; padding: 32px 20px 64px; }
  button { font: inherit; }

  /* Header and section titles */
  .top h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
  .sub { color: var(--dim); margin: 4px 0 0; }
  .sec { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    margin: 40px 0 12px; }
  .sec h2 { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); margin: 0; }
  .sec h2 span { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--faint); margin-left: 6px; }
  .card { background: var(--surf); border-radius: var(--r); padding: 18px 20px; border: 1px solid color-mix(in srgb, var(--line) 50%, transparent); }
  .pills { display: flex; gap: 4px; flex-wrap: wrap; background: var(--surf); padding: 4px; border-radius: 10px; }
  .pills button { background: transparent; color: var(--dim); border: 0; border-radius: 7px; padding: 5px 12px; cursor: pointer; }
  .pills button:hover { color: var(--fg); }
  .pills button[aria-pressed="true"] { background: var(--bg); color: var(--fg); }
  .empty { color: var(--faint); padding: 40px 0; text-align: center; }

  /* Today */
  .today { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-top: 24px; }
  .hero { position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 6px; min-height: 178px; }
  .hero::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--c); opacity: 0.9; }
  .hero .label { color: var(--dim); display: flex; justify-content: space-between; }
  .hero .label span { color: var(--faint); font-size: 12px; }
  .hero .value { font-size: 36px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
  .hero .value small { font-size: 15px; font-weight: 500; color: var(--dim); margin-left: 4px; letter-spacing: 0; }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 2px 8px; border-radius: 99px;
    background: color-mix(in srgb, var(--c, var(--dim)) 16%, transparent); color: var(--c, var(--dim)); width: fit-content; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .spark { height: 40px; margin-top: auto; }
  .stagebar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; }
  .stagebar div { background: var(--c); }
  .bbbar { position: relative; height: 8px; border-radius: 4px; background: var(--bg); }
  .bbbar div { position: absolute; top: 0; bottom: 0; border-radius: 4px; background: var(--c); }

  /* Recent workouts */
  .recent { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
  .wcard { text-align: left; color: inherit; cursor: pointer; display: grid; grid-template-columns: 1fr 96px; gap: 4px 14px;
    transition: transform 0.15s, border-color 0.15s; }
  .wcard:hover, .wcard:focus-visible { transform: translateY(-2px); border-color: var(--c); outline: none; }
  .wcard .badge { grid-column: 1; }
  .wcard .name { grid-column: 1; font-size: 17px; font-weight: 600; line-height: 1.25; }
  .wcard .route { grid-column: 2; grid-row: 1 / 4; width: 96px; height: 96px; border-radius: 10px; background: var(--bg); }
  .wcard .nums { grid-column: 1 / -1; display: flex; gap: 22px; margin-top: 10px; flex-wrap: wrap; }
  .nums div { display: flex; flex-direction: column; }
  .nums b { font-size: 18px; font-weight: 650; }
  .nums b small { font-size: 12px; color: var(--dim); font-weight: 400; margin-left: 2px; }
  .nums span { color: var(--faint); font-size: 12px; }
  .badge { font-size: 12px; color: var(--dim); display: flex; gap: 8px; align-items: center; }
  .badge i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); display: inline-block; }
  .badge b { color: var(--c); font-weight: 600; }

  /* Week */
  .week { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .week .card { padding: 14px 16px; }
  .week .k { color: var(--dim); }
  .week .v { font-size: 24px; font-weight: 650; margin: 2px 0; }
  .week .v small { font-size: 13px; color: var(--dim); font-weight: 400; margin-left: 3px; }
  .week .was { color: var(--faint); font-size: 12px; }

  /* Trend charts */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 12px; }
  .grid .card h3 { font-size: 16px; font-weight: 600; margin: 0; }
  .grid .card .unit { color: var(--dim); font-size: 12px; margin-bottom: 10px; }
  .phead { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; margin-top: 8px; }
  .phead b { font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .phead b::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
  .phead span { color: var(--dim); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--dim); font-size: 12px; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px;
    background: var(--c); margin-right: 6px; vertical-align: -1px; }
  .plot { position: relative; height: 140px; }
  .plot.tall { height: 300px; }
  svg { display: block; width: 100%; height: 100%; overflow: visible; }
  svg text { fill: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }
  .hit { fill: transparent; cursor: default; outline: none; }
  .hit:hover + .mark, .hit:focus + .mark { filter: brightness(1.3); }

  /* Calendar */
  .calwrap { overflow-x: auto; padding-bottom: 4px; }
  svg.cal { width: auto; height: auto; }
  .cal rect.day { rx: 3px; }
  .calfoot { display: flex; justify-content: space-between; align-items: center; color: var(--faint); font-size: 12px; margin-top: 10px; flex-wrap: wrap; gap: 8px; }
  .scale { display: flex; gap: 3px; align-items: center; }
  .scale i { width: 12px; height: 12px; border-radius: 3px; background: var(--c); display: inline-block; }

  /* Records */
  .records { align-items: start; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 12px; }
  @media (max-width: 860px) { .records { grid-template-columns: 1fr; } }
  .bigs { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px 28px; }
  .records h3 { font-size: 16px; font-weight: 600; margin: 0 0 10px; }
  .rec { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 10px 0; border-top: 1px solid var(--line);
    background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; color: inherit; text-align: left; cursor: pointer; }
  .rec:first-of-type { border-top: 0; }
  .rec:hover .what, .rec:focus-visible .what { color: var(--accent); }
  .rec .what { font-weight: 500; }
  .rec .val { font-weight: 650; font-size: 16px; text-align: right; }
  .rec .when, .rec .extra { color: var(--faint); font-size: 12px; }
  .rec .extra { text-align: right; }
  .sportrec h4 { margin: 0 0 2px; font-size: 13px; font-weight: 600; color: var(--c); }

  /* Workout list */
  .wlist { display: flex; flex-direction: column; }
  .wrow { display: grid; grid-template-columns: 10px minmax(0, 1fr) 90px 80px 90px; gap: 12px; align-items: center;
    padding: 9px 6px; border: 0; border-top: 1px solid var(--line); background: none; color: inherit; text-align: left;
    cursor: pointer; border-radius: 0; }
  .wrow:first-child { border-top: 0; }
  .wrow:hover, .wrow:focus-visible { background: var(--bg); outline: none; }
  .wrow i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .wrow .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wrow .n span { color: var(--faint); margin-left: 8px; font-size: 12px; }
  .wrow .r { text-align: right; color: var(--dim); }
  @media (max-width: 620px) { .wrow { grid-template-columns: 10px minmax(0, 1fr) 80px; } .wrow .r.x { display: none; } }

  /* Workout detail */
  dialog { width: min(1120px, calc(100vw - 32px)); max-height: calc(100vh - 32px); padding: 0; border: 1px solid var(--line);
    border-radius: 18px; background: var(--surf); color: var(--fg); scrollbar-color: var(--line) transparent; }
  dialog::backdrop { background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(3px); }
  .dhead { position: sticky; top: 0; z-index: 3; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    padding: 18px 22px 14px; background: var(--surf); border-bottom: 1px solid var(--line); }
  .dhead h3 { font-size: 22px; font-weight: 700; margin: 2px 0 0; letter-spacing: -0.01em; }
  .dhead .when { color: var(--dim); }
  .close { background: var(--bg); color: var(--dim); border: 0; border-radius: 8px; width: 34px; height: 34px; font-size: 18px; cursor: pointer; }
  .close:hover { color: var(--fg); }
  #dbody { padding: 18px 22px 26px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin-bottom: 16px; }
  .stat { background: var(--bg); border-radius: 10px; padding: 9px 12px; }
  .stat .k { color: var(--dim); font-size: 12px; }
  .stat .v { font-size: 19px; font-weight: 650; }
  .stat .v small { font-size: 12px; font-weight: 400; color: var(--dim); margin-left: 3px; }
  .section { margin: 22px 0 8px; font-weight: 600; }
  .zones { display: flex; gap: 2px; height: 28px; }
  .zones div { border-radius: 4px; font-size: 12px; line-height: 28px; padding-left: 6px; white-space: nowrap; min-width: 0; overflow: hidden; }
  .zone-legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--dim); font-size: 12px; margin-top: 6px; }
  .zone-legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px;
    background: var(--c); margin-right: 6px; vertical-align: -1px; }
  .act-top { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 12px; align-items: start; }
  @media (max-width: 860px) { .act-top { grid-template-columns: 1fr; } }
  .act-top .stats { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); margin: 0; }
  .map { height: 440px; border-radius: 12px; overflow: hidden; background: var(--bg); position: relative; }
  .map .note { position: absolute; left: 10px; bottom: 8px; color: var(--dim); font-size: 12px; z-index: 2; }
  .map-key { display: flex; gap: 14px; color: var(--dim); font-size: 12px; margin-top: 6px; }
  .map-key span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    background: var(--c); margin-right: 6px; vertical-align: -1px; box-shadow: 0 0 0 2px var(--surf); }
  .xmode { display: flex; gap: 8px; margin: 22px 0 4px; align-items: center; color: var(--dim); font-size: 12px; }
  .tchart { margin-top: 10px; }
  .tchart .head { display: flex; justify-content: space-between; align-items: baseline; }
  .tchart .head b { font-weight: 600; }
  .tchart .head span { color: var(--dim); font-size: 12px; }
  .tchart .plot { height: 130px; }
  .table-wrap { overflow-x: auto; max-height: 300px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--dim); font-weight: 500; }

  #tip { position: fixed; pointer-events: none; background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 10px; font-size: 12px; display: none; z-index: 10; box-shadow: 0 6px 20px rgba(0,0,0,0.35); }
  #tip .d { color: var(--dim); margin-bottom: 2px; }
  #tip .row { display: flex; align-items: center; gap: 6px; }
  #tip .row b { color: var(--fg); font-weight: 600; }
  #tip .row i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; background: var(--c); }
  #tip .row span { color: var(--dim); }

  .maplibregl-ctrl-attrib { background: rgba(0, 0, 0, 0.4) !important; }
  .maplibregl-ctrl-attrib a { color: var(--dim) !important; }
  .maplibregl-ctrl-group { background: var(--surf) !important; }
  .maplibregl-ctrl-group button + button { border-top-color: var(--line) !important; }
  .maplibregl-ctrl-group button .maplibregl-ctrl-icon { filter: invert(1); opacity: 0.8; }
  @media (prefers-reduced-motion: reduce) { .wcard { transition: none; } .wcard:hover { transform: none; } }
</style>

<main>
  <header class="top">
    <h1>Health</h1>
    <p class="sub" id="sub"></p>
  </header>
  <section class="today" id="today" aria-label="Today"></section>

  <div class="sec"><h2>Recent workouts</h2></div>
  <section class="recent" id="recent"></section>

  <div class="sec"><h2>Last 7 days<span>against the 7 before</span></h2></div>
  <section class="week" id="week"></section>

  <div class="sec">
    <h2>Trends</h2>
    <div class="pills" id="range" role="group" aria-label="Date range">
      <button data-days="30">30 days</button><button data-days="90">90 days</button>
      <button data-days="180">6 months</button><button data-days="0">All</button>
    </div>
  </div>
  <section class="grid" id="charts"></section>

  <div class="sec">
    <h2>Calendar</h2>
    <div class="pills" id="calpick" role="group" aria-label="Calendar metric"></div>
  </div>
  <section class="card"><div class="calwrap" id="cal"></div><div class="calfoot" id="calfoot"></div></section>

  <div class="sec"><h2>Records</h2></div>
  <section class="records" id="records"></section>

  <div class="sec">
    <h2>All workouts<span id="wcount"></span></h2>
    <div class="pills" id="wfilter" role="group" aria-label="Sport"></div>
  </div>
  <section class="card"><div class="wlist" id="wlist"></div></section>
</main>

<dialog id="detail" aria-labelledby="dtitle">
  <div class="dhead">
    <div><div class="badge" id="dbadge"></div><h3 id="dtitle"></h3><div class="when" id="dwhen"></div></div>
    <button class="close" id="dclose" aria-label="Close">✕</button>
  </div>
  <div id="dbody"></div>
</dialog>
<div id="tip"></div>

<!--LIBS-->
<!--DATA-->

<script>
const D = JSON.parse(document.getElementById("data").textContent);
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs = {}, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
};
const h = (tag, attrs = {}, text) => {
  const e = document.createElement(tag);
  Object.assign(e, attrs);
  if (text !== undefined) e.textContent = text;
  return e;
};
const withC = (e, c) => { e.style.setProperty("--c", c); return e; };
const fmt = (n, dp = 0) => n == null ? "–" : Number(n).toLocaleString(undefined, { maximumFractionDigits: dp, minimumFractionDigits: dp });
const dayLabel = (d) => new Date(d + "T12:00").toLocaleDateString(undefined, { month: "short", day: "numeric" });
const longDay = (d) => new Date(d + "T12:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
const localDay = (ms) => { const t = new Date(ms); return new Date(t - t.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const dayNum = (d) => Math.round(new Date(d + "T12:00") / 864e5);
const numDay = (n) => localDay(n * 864e5);
const hm = (hours) => { const m = Math.round(hours * 60); return `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m`; };
const MI = 1609.344, FT = 3.28084;
const clock = (s) => {
  s = Math.round(s);
  const hh = Math.floor(s / 3600), mm = Math.floor((s % 3600) / 60), ss = s % 60;
  return (hh ? `${hh}:${String(mm).padStart(2, "0")}` : `${mm}`) + `:${String(ss).padStart(2, "0")}`;
};
const mean = (a) => { a = a.filter((x) => x != null); return a.length ? a.reduce((x, y) => x + y, 0) / a.length : null; };
const median = (a) => { a = a.filter((x) => x != null).sort((x, y) => x - y); return a.length ? a[Math.floor(a.length / 2)] : null; };

// ---- Data ---------------------------------------------------------------
// Today isn't over: its daytime numbers are partial, so only last night's (sleep, HRV) count yet.
const todayStr = localDay(Date.now());
const DAYS = D.days.map((r) => r.d !== todayStr ? r : Object.fromEntries(Object.entries(r).filter(([k]) =>
  ["d", "deep", "rem", "light", "awake", "score", "hrv", "hrvLo", "hrvHi", "vo2", "fit", "fat", "ef"].includes(k)))).map((r) => ({ ...r, dn: dayNum(r.d),
  sleep: [r.deep, r.rem, r.light].some((x) => x != null) ? (r.deep || 0) + (r.rem || 0) + (r.light || 0) : null }));
const byDn = new Map(DAYS.map((r) => [r.dn, r]));
const lastDn = DAYS.length ? DAYS[DAYS.length - 1].dn : dayNum(localDay(Date.now()));
const firstDn = DAYS.length ? DAYS[0].dn : lastDn;
const todayDn = dayNum(todayStr);
const latest = (k) => { for (let i = DAYS.length - 1; i >= 0; i--) if (DAYS[i][k] != null) return DAYS[i]; return null; };
// Your normal: the median of the 30 days before this one.
const usual = (k, dn) => median(DAYS.filter((r) => r.dn < dn && r.dn >= dn - 30).map((r) => r[k]));

const W = D.workouts.map((w, i) => ({ ...w, i }));
const SPORTS = {
  run: ["Run", "--rust"], trail: ["Trail run", "--amber"], hike: ["Hike", "--amber"], walk: ["Walk", "--accent"],
  ride: ["Ride", "--teal"], gym: ["Training", "--violet"], other: ["Other", "--dim"],
};
const sportOf = (w) => {
  const t = `${w.type || ""} ${w.sport || ""} ${w.sub || ""} ${w.name || ""}`.toLowerCase();
  if (/trail/.test(t) && /run/.test(t)) return "trail";
  if (/run/.test(t)) return "run";
  if (/hik|ruck/.test(t)) return "hike";
  if (/walk/.test(t)) return "walk";
  if (/cycl|bik|ride/.test(t)) return "ride";
  if (/strength|training|cardio|row|breath|yoga|fitness/.test(t)) return "gym";
  return "other";
};
for (const w of W) { w.kind = sportOf(w); w.color = css(SPORTS[w.kind][1]); w.label = w.name || SPORTS[w.kind][0]; }
const onFoot = (w) => ["run", "trail", "hike", "walk"].includes(w.kind);
const paceOf = (w) => w.dist > 100 && w.secs ? w.secs / (w.dist / MI) : null;

// ---- Tooltip ------------------------------------------------------------
const tip = document.getElementById("tip");
function showTip(evt, heading, items) {
  tip.replaceChildren(h("div", { className: "d" }, heading));
  for (const it of items) {
    const row = h("div", { className: "row" });
    row.append(withC(h("i"), it.color || "transparent"), h("b", {}, it.value), h("span", {}, it.name));
    tip.appendChild(row);
  }
  tip.style.display = "block";
  const r = evt.target.getBoundingClientRect ? evt.target.getBoundingClientRect() : null;
  const x = evt.clientX || (r.left + r.width / 2), y = evt.clientY || r.top;
  tip.style.left = Math.min(x + 14, innerWidth - tip.offsetWidth - 8) + "px";
  tip.style.top = Math.min(y + 14, innerHeight - tip.offsetHeight - 8) + "px";
}
const hideTip = () => { tip.style.display = "none"; };
const hover = (node, fn) => {
  node.addEventListener("pointermove", fn); node.addEventListener("focus", fn);
  node.addEventListener("pointerleave", hideTip); node.addEventListener("blur", hideTip);
};

// ---- Small pieces -------------------------------------------------------
// A round tick step (1, 2 or 5 × a power of ten) giving about four intervals.
function niceStep(span) {
  const raw = (span > 0 ? span : 1) / 4;
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  for (const m of [1, 2, 5, 10]) if (m * p >= raw) return m * p;
}
function colPath(x, y0, y1, w, r) {
  const top = Math.min(y0, y1), bot = Math.max(y0, y1);
  r = Math.min(r, w / 2, bot - top);
  return `M${x},${bot}V${top + r}Q${x},${top} ${x + r},${top}H${x + w - r}Q${x + w},${top} ${x + w},${top + r}V${bot}Z`;
}
function pillPath(x, y0, y1, w, r) {
  const top = Math.min(y0, y1), bot = Math.max(y0, y1);
  r = Math.min(r, w / 2, (bot - top) / 2);
  return `M${x},${top + r}Q${x},${top} ${x + r},${top}H${x + w - r}Q${x + w},${top} ${x + w},${top + r}V${bot - r}Q${x + w},${bot} ${x + w - r},${bot}H${x + r}Q${x},${bot} ${x},${bot - r}Z`;
}
// Sparkline of the last n days of k; optional shaded band (lo/hi keys).
function spark(box, k, color, n = 21, band) {
  const rows = DAYS.filter((r) => r.dn > lastDn - n);
  const vals = rows.flatMap((r) => [r[k], band && r[band[0]], band && r[band[1]]]).filter((v) => v != null && v !== false);
  if (vals.length < 2) return;
  const Wd = 200, Hd = 40, lo = Math.min(...vals), hi = Math.max(...vals), sp = hi - lo || 1;
  const x = (dn) => ((dn - (lastDn - n + 1)) / (n - 1)) * Wd, y = (v) => Hd - 3 - ((v - lo) / sp) * (Hd - 6);
  const svg = el("svg", { viewBox: `0 0 ${Wd} ${Hd}`, preserveAspectRatio: "none", class: "spark", "aria-hidden": "true" }, box);
  if (band) {
    const b = rows.filter((r) => r[band[0]] != null);
    if (b.length > 1) el("path", { d: "M" + b.map((r) => `${x(r.dn)},${y(r[band[1]])}`).join("L") + "L" +
      b.slice().reverse().map((r) => `${x(r.dn)},${y(r[band[0]])}`).join("L") + "Z", fill: color, "fill-opacity": 0.12 }, svg);
  }
  const pts = rows.filter((r) => r[k] != null);
  el("path", { d: "M" + pts.map((r) => `${x(r.dn)},${y(r[k])}`).join("L"), fill: "none", stroke: color, "stroke-width": 2,
    "stroke-linejoin": "round", "stroke-linecap": "round", "vector-effect": "non-scaling-stroke" }, svg);
}
// "▲ 4 vs usual": good/bad by which way is better; within the usual spread it's just "usual".
function vsUsual(v, base, better, unit = "", dp = 0, tol = 0.05) {
  if (v == null || base == null) return h("span", { className: "chip" }, "building your baseline");
  const d = v - base;
  if (Math.abs(d) <= Math.abs(base) * tol) return h("span", { className: "chip" }, "about usual");
  const good = (d > 0) === (better > 0);
  return withC(h("span", { className: "chip" }, `${d > 0 ? "▲" : "▼"} ${fmt(Math.abs(d), dp)}${unit} vs usual`), css(good ? "--good" : "--bad"));
}

// ---- Today --------------------------------------------------------------
function today() {
  const box = document.getElementById("today");
  const tile = (label, row, color) => {
    const t = withC(h("article", { className: "card hero" }), color);
    const l = h("div", { className: "label" }, label);
    l.appendChild(h("span", {}, row ? (row.dn === todayDn ? "today" : row.dn === todayDn - 1 ? "yesterday" : longDay(row.d)) : ""));
    t.appendChild(l);
    box.appendChild(t);
    return t;
  };
  const val = (t, v, unit) => { const e = h("div", { className: "value" }, v); if (unit) e.appendChild(h("small", {}, unit)); t.appendChild(e); };

  const s = latest("sleep");
  const st = tile("Sleep", s, css("--deep"));
  if (s) {
    val(st, hm(s.sleep));
    const chips = h("div", { className: "chips" });
    chips.appendChild(vsUsual(s.sleep, usual("sleep", s.dn), +1, " h", 1, 0.06));
    if (s.score != null) chips.appendChild(withC(h("span", { className: "chip" }, `score ${s.score}`), css("--fg")));
    if (s.awake >= 0.5) chips.appendChild(withC(h("span", { className: "chip" }, `${hm(s.awake)} awake`), css("--awake")));
    st.appendChild(chips);
    const bar = h("div", { className: "stagebar", role: "img" });
    bar.setAttribute("aria-label", `Deep ${hm(s.deep || 0)}, REM ${hm(s.rem || 0)}, light ${hm(s.light || 0)}`);
    for (const k of ["deep", "rem", "light", "awake"]) if (s[k]) { const seg = withC(h("div"), css("--" + k)); seg.style.flex = s[k]; bar.appendChild(seg); }
    st.appendChild(bar);
    spark(st, "sleep", css("--deep"));
  } else val(st, "–");

  const v = latest("hrv");
  const ht = tile("HRV overnight", v, css("--teal"));
  if (v) {
    val(ht, fmt(v.hrv), "ms");
    const inBand = v.hrvLo != null && v.hrv >= v.hrvLo && v.hrv <= v.hrvHi;
    ht.appendChild(v.hrvLo == null ? vsUsual(v.hrv, usual("hrv", v.dn), +1, " ms") :
      withC(h("span", { className: "chip" }, inBand ? `balanced · ${v.hrvLo}–${v.hrvHi}` : `${v.hrv < v.hrvLo ? "below" : "above"} your ${v.hrvLo}–${v.hrvHi} range`),
        css(inBand ? "--good" : v.hrv < v.hrvLo ? "--bad" : "--amber")));
    spark(ht, "hrv", css("--teal"), 21, ["hrvLo", "hrvHi"]);
  } else val(ht, "–");

  const r = latest("rhr");
  const rt = tile("Resting heart rate", r, css("--rust"));
  if (r) { val(rt, fmt(r.rhr), "bpm"); rt.appendChild(vsUsual(r.rhr, usual("rhr", r.dn), -1, " bpm", 0, 0.02)); spark(rt, "rhr", css("--rust")); }
  else val(rt, "–");

  const b = latest("bbHi");
  const bt = tile("Body Battery", b, css("--accent"));
  if (b) {
    val(bt, fmt(b.bbHi), b.bbLo != null ? `low ${b.bbLo}` : "");
    bt.appendChild(vsUsual(b.bbHi, usual("bbHi", b.dn), +1, "", 0, 0.08));
    const bar = h("div", { className: "bbbar", role: "img" });
    bar.setAttribute("aria-label", `From ${b.bbLo} to ${b.bbHi} of 100`);
    const fill = withC(h("div"), css("--accent"));
    fill.style.left = (b.bbLo ?? 0) + "%"; fill.style.width = (b.bbHi - (b.bbLo ?? 0)) + "%";
    bar.appendChild(fill); bt.appendChild(bar);
    spark(bt, "bbHi", css("--accent"));
  } else val(bt, "–");

  // Only some workouts update VO2 max, so its sparkline looks back 90 days.
  const o = latest("vo2");
  const ot = tile("VO2 max", o, css("--amber"));
  if (o) { val(ot, fmt(o.vo2, 1), "ml/kg/min"); ot.appendChild(vsUsual(o.vo2, usual("vo2", o.dn), +1, "", 1, 0.01)); spark(ot, "vo2", css("--amber"), 90); }
  else val(ot, "–");
}

// ---- Workout cards ------------------------------------------------------
function trackOf(w) {
  if (!w.track) return null;
  const raw = w.track;
  const tr = { sport: w.sport || "", laps: w.laps || [] };
  raw.cols.forEach((c, i) => { tr[c] = raw.rows.map((r) => r[i] ?? null); });
  return tr;
}
// The route as a little line drawing, north up.
function routeSvg(w, cls) {
  const svg = el("svg", { viewBox: "0 0 100 100", class: cls, "aria-hidden": "true" });
  const tr = trackOf(w);
  const pts = tr ? tr.lat.map((la, i) => la == null ? null : [tr.lon[i], la]).filter(Boolean) : [];
  if (pts.length < 2) {
    el("circle", { cx: 50, cy: 50, r: 16, fill: "none", stroke: w.color, "stroke-width": 3, opacity: 0.6 }, svg);
    return svg;
  }
  const k = Math.cos((pts[0][1] * Math.PI) / 180);
  const xs = pts.map((p) => p[0] * k), ys = pts.map((p) => p[1]);
  const x0 = Math.min(...xs), y1 = Math.max(...ys), span = Math.max(Math.max(...xs) - x0, y1 - Math.min(...ys)) || 1;
  const ox = (84 - ((Math.max(...xs) - x0) / span) * 84) / 2, oy = (84 - ((y1 - Math.min(...ys)) / span) * 84) / 2;
  const P = pts.map((_, i) => [8 + ox + ((xs[i] - x0) / span) * 84, 8 + oy + ((y1 - ys[i]) / span) * 84]);
  el("path", { d: "M" + P.map((p) => p.map((v) => v.toFixed(1)).join(",")).join("L"), fill: "none", stroke: w.color,
    "stroke-width": 2.5, "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
  el("circle", { cx: P[0][0], cy: P[0][1], r: 3.5, fill: w.color }, svg);
  return svg;
}
const nums = (w) => {
  const box = h("div", { className: "nums" });
  const n = (v, unit, k) => { if (v == null) return; const d = h("div"); const b = h("b", {}, v); if (unit) b.appendChild(h("small", {}, unit)); d.append(b, h("span", {}, k)); box.appendChild(d); };
  if (w.dist > 100) n(fmt(w.dist / MI, 2), "mi", "distance");
  n(w.secs ? clock(w.secs) : null, "", "time");
  if (onFoot(w) && paceOf(w)) n(clock(paceOf(w)), "/mi", "pace");
  else if (w.kind === "ride" && w.dist) n(fmt((w.dist / MI) / (w.secs / 3600), 1), "mph", "speed");
  if (box.children.length < 3) n(w.hr ? fmt(w.hr) : null, "bpm", "avg heart rate");
  return box;
};
const badge = (w) => {
  const b = withC(h("div", { className: "badge" }), w.color);
  const same = w.label.toLowerCase().includes(SPORTS[w.kind][0].toLowerCase());
  b.append(h("i"), same ? "" : h("b", {}, SPORTS[w.kind][0]), h("span", {}, new Date(w.start).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" })));
  return b;
};
function recent() {
  const box = document.getElementById("recent");
  const last = W.slice(-3).reverse();
  if (!last.length) { box.appendChild(h("div", { className: "empty" }, "No workouts yet")); return; }
  for (const w of last) {

    if (w.place && w.place !== w.label) c.insertBefore(h("div", { className: "badge" }, w.place), c.children[2]);

// ---- Week ---------------------------------------------------------------
function week() {
  const box = document.getElementById("week");
  const span = (a, b) => DAYS.filter((r) => r.dn > lastDn - b && r.dn <= lastDn - a);
  const ws = (a, b) => W.filter((w) => { const dn = dayNum(localDay(w.start)); return dn > lastDn - b && dn <= lastDn - a; });
  const items = [
    ["Steps", (r) => mean(r.map((x) => x.steps)), (v) => fmt(v), "a day"],
    ["Sleep", (r) => mean(r.map((x) => x.sleep)), (v) => hm(v), "a night"],
    ["HRV", (r) => mean(r.map((x) => x.hrv)), (v) => fmt(v), "ms"],
    ["Intensity", (r) => r.reduce((s, x) => s + (x.intensity || 0), 0), (v) => fmt(v), "min"],
  ];
  for (const [k, f, show, unit] of items) {
    const now = f(span(0, 7)), was = f(span(7, 14));
    card(k, now == null ? "–" : show(now), unit, was == null ? "no data the week before" : `was ${show(was)}`, now, was);
  }
  const wn = ws(0, 7), ww = ws(7, 14);
  const t = (l) => l.reduce((s, w) => s + (w.secs || 0), 0);
  card("Workouts", String(wn.length), wn.length ? clock(t(wn)) : "", `was ${ww.length}${ww.length ? " · " + clock(t(ww)) : ""}`, t(wn), t(ww));
  function card(k, v, unit, wasText, now, was) {
    const c = h("div", { className: "card" });
    const vv = h("div", { className: "v" }, v); if (unit) vv.appendChild(h("small", {}, unit));
    const w = h("div", { className: "was" }, wasText);
    if (now != null && was) {
      const pc = Math.round(((now - was) / was) * 100);
      const txt = pc > 100 ? `▲ ${fmt(now / was, 1)}×` : `${pc > 0 ? "▲" : "▼"} ${Math.abs(pc)}%`;
      if (Math.abs(pc) >= 3) w.prepend(withC(h("span", { className: "chip" }, txt), css(pc > 0 ? "--good" : "--bad")), " ");
    }
    c.append(h("div", { className: "k" }, k), vv, w);
    box.appendChild(c);
  }
}

const STAGES = [["deep", "Deep"], ["rem", "REM"], ["light", "Light"], ["awake", "Awake"]];

  { title: "Sleep", unit: "hours a night, by stage", legend: STAGES.map(([k, n]) => [n, css("--" + k)]), plots: [

];
for (const c of CARDS) for (const p of c.plots) if (!p.rows) p.rows = DAYS.filter((r) => r[p.key || p.hi] != null);

let rangeDays = 90;
const domain = () => { const n = rangeDays ? Math.min(rangeDays, lastDn - firstDn + 1) : lastDn - firstDn + 1; return { n0: lastDn - n + 1, n }; };

function drawPlot(plot, p, dom) {
  plot.replaceChildren();
  const rows = p.rows.filter((r) => r.dn >= dom.n0);
  if (!rows.length) { plot.appendChild(h("div", { className: "empty" }, "No data in this range")); return; }
  const Wd = plot.clientWidth, Hd = plot.clientHeight;
  const m = { l: 40, r: p.type === "line" ? 40 : 8, t: 8, b: 20 };
  const svg = el("svg", { viewBox: `0 0 ${Wd} ${Hd}`, role: "img", "aria-label": p.name || "Sleep" }, plot);
  const iw = Wd - m.l - m.r, ih = Hd - m.t - m.b;
  const vals = rows.flatMap((r) => p.type === "stack" ? [r.parts.reduce((a, b) => a + b, 0)] :
    p.type === "range" ? [r[p.lo], r[p.hi]] : p.band ? [r[p.key], r[p.band[0]], r[p.band[1]]] : [r[p.key]]).filter((v) => v != null);
  const mn = Math.min(...vals), mx = Math.max(...vals);
  let lo, hi, step;
  if (p.type === "line") {   // lines zoom to their data, with half a step of air
    step = niceStep(mx - mn);
    lo = Math.max(0, Math.floor((mn - step / 2) / step) * step); hi = Math.ceil((mx + step / 2) / step) * step;
  } else if (p.max) { lo = 0; hi = p.max; step = p.max / 2; }
  else { lo = 0; step = niceStep(mx); hi = Math.max(step, Math.ceil(mx / step) * step); }
  const y = (v) => m.t + ih - ((v - lo) / (hi - lo)) * ih;
  const band = iw / dom.n;
  const x = (r) => m.l + band * (r.dn - dom.n0 + 0.5);

  for (let v = lo; v <= hi + step / 1e6; v += step) {
    el("line", { x1: m.l, x2: m.l + iw, y1: y(v), y2: y(v), stroke: css("--line"), "stroke-width": 1, "stroke-dasharray": v === lo ? "" : "2 4" }, svg);
    el("text", { x: m.l - 6, y: y(v) + 4, "text-anchor": "end" }, svg).textContent = v >= 10000 ? fmt(v / 1000) + "K" : fmt(v, step < 1 ? 1 : 0);
  }
  for (const k of [...new Set([0, Math.floor((dom.n - 1) / 2), dom.n - 1])]) {
    const anchor = k === 0 ? "start" : k === dom.n - 1 ? "end" : "middle";
    el("text", { x: m.l + band * (k + (k === 0 ? 0 : k === dom.n - 1 ? 1 : 0.5)), y: Hd - 4, "text-anchor": anchor }, svg).textContent = dayLabel(numDay(dom.n0 + k));
  }

  const surf = css("--surf"), bw = Math.min(18, Math.max(1.5, band - (band > 6 ? 2 : 0.5)));
  if (p.type !== "line") {
    for (const r of rows) {
      const bx = x(r) - bw / 2;
      const hit = el("rect", { x: x(r) - Math.max(band, 10) / 2, y: m.t, width: Math.max(band, 10), height: ih, class: "hit" }, svg);
      const g = el("g", { class: "mark" }, svg);
      let items;
      if (p.type === "bar") {
        el("path", { d: colPath(bx, y(0), y(r[p.key]), bw, Math.min(3, bw / 2)), fill: p.color }, g);
        items = [{ name: p.name.toLowerCase(), value: fmt(r[p.key]) + (p.unit ? " " + p.unit : ""), color: p.color }];
      } else if (p.type === "range") {
        el("path", { d: pillPath(bx, y(r[p.lo] ?? r[p.hi]), y(r[p.hi]), bw, 3), fill: p.color }, g);
        items = [{ name: "highest", value: fmt(r[p.hi]), color: p.color }, { name: "lowest", value: fmt(r[p.lo]), color: p.color }];
      } else {
        let acc = 0;
        r.parts.forEach((part, k) => {
          if (part <= 0) return;
          const y0 = y(acc), y1 = y(acc + part); acc += part;
          if (y0 - y1 > 1.5) el("rect", { x: bx, y: y1 + 1, width: bw, height: y0 - y1 - 1, rx: Math.min(2, bw / 3), fill: p.series[k].color }, g);
        });
        items = [{ name: "asleep", value: hm(r.sleep) }, ...p.series.map((s, k) => ({ name: s.name, value: hm(r.parts[k]), color: s.color })),
          ...p.extra(r).filter(Boolean)];
      }
      hover(hit, (e) => showTip(e, longDay(r.d), items));
    }
    return;
  }
  // Lines: a missing day breaks the line; a lone day gets a dot.
  const runs = (key) => {
    const out = []; let cur = [];
    for (const r of rows) {
      if (r[key] == null || (cur.length && r.dn - cur[cur.length - 1].dn > 1)) { if (cur.length) out.push(cur); cur = []; }
      if (r[key] != null) cur.push(r);
    }
    if (cur.length) out.push(cur);
    return out;
  };
  if (p.band) for (const run of runs(p.band[1])) {
    el("path", { d: "M" + run.map((r) => `${x(r)},${y(r[p.band[1]])}`).join("L") + "L" + run.slice().reverse().map((r) => `${x(r)},${y(r[p.band[0]])}`).join("L") + "Z",
      fill: p.color, "fill-opacity": 0.12 }, svg);
  }
  for (const run of runs(p.key)) {
    if (run.length === 1) { el("circle", { cx: x(run[0]), cy: y(run[0][p.key]), r: 2.5, fill: p.color }, svg); continue; }
    el("path", { d: "M" + run.map((r) => `${x(r)},${y(r[p.key])}`).join("L"), fill: "none", stroke: p.color,
      "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
  }
  const withV = rows.filter((r) => r[p.key] != null);
  const last = withV[withV.length - 1];
  if (last) {
    el("circle", { cx: x(last), cy: y(last[p.key]), r: 4, fill: p.color, stroke: surf, "stroke-width": 2 }, svg);
    el("text", { x: x(last) + 8, y: y(last[p.key]) + 4, fill: p.color }, svg).textContent = fmt(last[p.key]);
  }
  const cross = el("line", { y1: m.t, y2: m.t + ih, stroke: css("--faint"), "stroke-width": 1, visibility: "hidden" }, svg);
  const dot = el("circle", { r: 4, fill: p.color, stroke: surf, "stroke-width": 2, visibility: "hidden" }, svg);
  const over = el("rect", { x: m.l, y: m.t, width: iw, height: ih, class: "hit", tabindex: 0 }, svg);
  let fi = withV.length - 1;
  const at = (r, e) => {
    cross.setAttribute("x1", x(r)); cross.setAttribute("x2", x(r)); cross.setAttribute("visibility", "visible");
    dot.setAttribute("cx", x(r)); dot.setAttribute("cy", y(r[p.key])); dot.setAttribute("visibility", "visible");
    const items = [{ name: p.unit, value: fmt(r[p.key]), color: p.color }];
    if (p.band && r[p.band[0]] != null) items.push({ name: "balanced range", value: `${fmt(r[p.band[0]])}–${fmt(r[p.band[1]])}`, color: p.color });
    showTip(e, `${p.name} · ${longDay(r.d)}`, items);
  };
  over.addEventListener("pointermove", (e) => {
    const b = svg.getBoundingClientRect(), px = (e.clientX - b.left) * (Wd / b.width);
    let best = withV[0];
    for (const r of withV) if (Math.abs(x(r) - px) < Math.abs(x(best) - px)) best = r;
    at(best, e);
  });
  over.addEventListener("focus", (e) => at(withV[fi], e));
  over.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") fi = Math.max(0, fi - 1); else if (e.key === "ArrowRight") fi = Math.min(withV.length - 1, fi + 1); else return;
    e.preventDefault(); at(withV[fi], e);
  });
  const off = () => { hideTip(); cross.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); };
  over.addEventListener("pointerleave", off); over.addEventListener("blur", off);
}

function renderCharts() {
  for (const b of document.querySelectorAll("#range button")) b.setAttribute("aria-pressed", String(Number(b.dataset.days) === rangeDays));
  const dom = domain();

      p.readout.textContent = avg == null ? "" : `average ${fmt(avg)}${p.unit ? " " + p.unit : ""}`;
    }
  }
}

// ---- Calendar -----------------------------------------------------------
const CAL = [
  ["Steps", "steps", "--violet", (v) => fmt(v)], ["Sleep", "sleep", "--deep", hm], ["HRV", "hrv", "--teal", (v) => fmt(v) + " ms"],
  ["Body Battery", "bbHi", "--accent", (v) => fmt(v)], ["Stress", "stress", "--amber", (v) => fmt(v)],
];
let calKey = 0;
function calendar() {
  const [name, k, cvar, show] = CAL[calKey];
  const color = css(cvar);
  for (const [i, b] of [...document.querySelectorAll("#calpick button")].entries()) b.setAttribute("aria-pressed", String(i === calKey));
  const box = document.getElementById("cal");
  box.replaceChildren();
  // Columns are weeks starting Monday; rows are days.
  const wd = (dn) => (new Date(numDay(dn) + "T12:00").getDay() + 6) % 7;
  const start = firstDn - wd(firstDn), weeks = Math.ceil((lastDn - start + 1) / 7);
  const gap = 4, left = 30, top = 18;
  const cell = Math.max(12, Math.min(24, Math.floor((box.clientWidth - left) / weeks) - gap));
  const svg = el("svg", { class: "cal", width: left + weeks * (cell + gap), height: top + 7 * (cell + gap), role: "img", "aria-label": `${name} by day` }, box);
  const vals = DAYS.map((r) => r[k]).filter((v) => v != null).sort((a, b) => a - b);
  const lo = vals[Math.floor(vals.length * 0.05)] ?? 0, hi = vals[Math.floor(vals.length * 0.95)] ?? 1;
  const wByDn = {};
  for (const w of W) (wByDn[dayNum(localDay(w.start))] ||= []).push(w);
  ["Mon", "", "Wed", "", "Fri", "", ""].forEach((t, i) => t && (el("text", { x: 0, y: top + i * (cell + gap) + cell / 2 + 4 }, svg).textContent = t));
  let lastMonth = -1;
  for (let dn = start; dn <= lastDn; dn++) {
    const col = Math.floor((dn - start) / 7), row = wd(dn), X = left + col * (cell + gap), Y = top + row * (cell + gap);
    const mo = new Date(numDay(dn) + "T12:00").getMonth();
    if (row === 0 && mo !== lastMonth) { el("text", { x: X, y: 11 }, svg).textContent = new Date(numDay(dn) + "T12:00").toLocaleDateString(undefined, { month: "short" }); lastMonth = mo; }
    if (dn < firstDn) continue;
    const r = byDn.get(dn), v = r?.[k];
    const t = v == null ? 0 : Math.max(0, Math.min(1, (v - lo) / (hi - lo || 1)));
    const rect = el("rect", { x: X, y: Y, width: cell, height: cell, rx: 3, class: "day", tabindex: -1,

    const ws = wByDn[dn] || [];
    if (ws.length) el("circle", { cx: X + cell / 2, cy: Y + cell / 2, r: Math.max(2, cell / 7), fill: css("--fg"), "pointer-events": "none" }, svg);
    hover(rect, (e) => showTip(e, longDay(numDay(dn)), [{ name: name.toLowerCase(), value: v == null ? "no data" : show(v), color },
      ...ws.map((w) => ({ name: w.label, value: SPORTS[w.kind][0], color: w.color }))]));
    if (ws.length) { rect.style.cursor = "pointer"; rect.addEventListener("click", () => detail(ws[ws.length - 1])); }
  }
  const foot = document.getElementById("calfoot");
  const scale = h("div", { className: "scale" }, "less ");
  for (const o of [0.18, 0.38, 0.58, 0.79, 1]) { const i = withC(h("i"), color); i.style.opacity = o; scale.appendChild(i); }
  scale.append(" more");
  foot.replaceChildren(scale, h("span", {}, "● a workout that day: click to open it"));
}
{

const dlg = document.getElementById("detail");

document.getElementById("dclose").addEventListener("click", () => dlg.close());

const ZONES = [["Warm-up", "--z1"], ["Easy", "--z2"], ["Aerobic", "--z3"], ["Threshold", "--z4"], ["Maximum", "--z5"]];
const ZONE_INK = ["#fff", "#fff", "#fff", "#111", "#111"];   // by the fill's lightness

function detail(w) {
  ACC = w.color;
  document.getElementById("dbadge").replaceChildren(...badge(w).childNodes);
  withC(document.getElementById("dbadge"), w.color);
  document.getElementById("dtitle").textContent = w.label;

    { weekday: "long", month: "long", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" }) + (w.place ? ` · ${w.place}` : "");
  const box = document.getElementById("dbody");
  box.replaceChildren();
  openMap?.remove(); openMap = null;
  dlg.appendChild(tip);   // the dialog sits in the top layer; the tooltip has to be inside it

  const stats = h("div", { className: "stats" });

    if (unit) val.appendChild(h("small", {}, unit));
    s.append(h("div", { className: "k" }, k), val);
    stats.appendChild(s);
  };
  stat("Time", w.secs ? clock(w.secs) : null);
  if (w.dist > 100) stat("Distance", fmt(w.dist / MI, 2), "mi");
  if (onFoot(w) && paceOf(w)) stat("Average pace", clock(paceOf(w)), "/mi");
  if (w.kind === "ride" && w.dist && w.secs) stat("Average speed", fmt((w.dist / MI) / (w.secs / 3600), 1), "mph");
  stat("Average heart rate", w.hr && fmt(w.hr), "bpm");
  stat("Max heart rate", w.maxhr && fmt(w.maxhr), "bpm");
  stat("Calories", w.cal && fmt(w.cal), "kcal");
  if (w.up || w.down) stat("Climb / descent", `${fmt((w.up || 0) * FT)} / ${fmt((w.down || 0) * FT)}`, "ft");
  stat("Average cadence", w.cad && fmt(w.cad), onFoot(w) ? "spm" : "rpm");
  stat("Aerobic effect", w.te != null ? fmt(w.te, 1) : null, "of 5");
  stat("Anaerobic effect", w.ate != null ? fmt(w.ate, 1) : null, "of 5");
  stat("Training load", w.load && fmt(w.load));
  stat("Average power", w.pwr && fmt(w.pwr), "W");
  for (const [k, v] of Object.entries(w.best || {})) if (w.kind === "run" || w.kind === "trail") stat(`Best ${k}`, clock(v));

  const tr = trackOf(w);
  const hasGps = tr && tr.lat.some((v) => v != null);
  if (hasGps) {
    const topRow = h("div", { className: "act-top" });
    const left = h("div");
    topRow.append(left, stats);
    box.appendChild(topRow);

  } else box.appendChild(stats);

  const zt = w.zones || [];
  const ztotal = zt.reduce((a, b) => a + b, 0);
  if (ztotal > 0) {
    box.appendChild(h("div", { className: "section" }, "Time in heart-rate zones"));
    const bar = h("div", { className: "zones", role: "img" });
    bar.setAttribute("aria-label", ZONES.map(([name], i) => `${name} ${clock(zt[i])}`).join(", "));
    ZONES.forEach(([name, c], i) => {
      if (!zt[i]) return;
      const seg = h("div", { tabIndex: 0 });
      seg.style.flex = `${zt[i]} 0 0`; seg.style.background = `var(${c})`; seg.style.color = ZONE_INK[i];
      const share = Math.round((zt[i] / ztotal) * 100) + "%";
      seg.textContent = share;
      requestAnimationFrame(() => { if (seg.scrollWidth > seg.clientWidth) seg.textContent = ""; });
      hover(seg, (e) => showTip(e, "Heart-rate zone", [{ name, value: `${clock(zt[i])} · ${share}`, color: css(c) }]));
      bar.appendChild(seg);
    });
    box.appendChild(bar);
    const lg = h("div", { className: "zone-legend" });
    ZONES.forEach(([name, c], i) => lg.appendChild(withC(h("span", {}, `${name} ${clock(zt[i])}`), `var(${c})`)));
    box.appendChild(lg);
  }

  if (tr && tr.t.length > 20) { trackCharts(box, tr); splitsTable(box, tr); }
  if (tr && tr.laps.length > 1) lapsTable(box, tr);

  const form = [
    ["Stride length", w.sl && fmt(w.sl / 25.4, 1), "in"], ["Vertical oscillation", w.vo && fmt(w.vo / 25.4, 1), "in"],
    ["Ground contact", w.gct && fmt(w.gct), "ms"], ["Vertical ratio", w.vr && fmt(w.vr, 1), "%"],
    ["Normalized power", w.np && fmt(w.np), "W"],
  ].filter((x) => x[1]);
  if (form.length) {

      const val = h("div", { className: "v" }, v); val.appendChild(h("small", {}, u));
      s.append(h("div", { className: "k" }, k), val);
      fs.appendChild(s);
    }
    box.appendChild(fs);
  }
}

function smooth(a, win) {
  return a.map((v, i) => {
    if (v == null) return null;
    let s = 0, n = 0;
    for (let j = Math.max(0, i - win); j <= Math.min(a.length - 1, i + win); j++) if (a[j] != null) { s += a[j]; n++; }
    return n ? s / n : null;
  });
}
const pct = (a, p) => { const v = a.filter((x) => x != null).sort((x, y) => x - y); return v.length ? v[Math.min(v.length - 1, Math.floor(p * v.length))] : null; };

// The map: your route over the offline OpenStreetMap area (health-map), or
// over plain background if there is none yet. Returns { mark(i) }.
let pmtilesReady = null;
function mapPanel(container, tr) {
  const box = h("div", { className: "map" });
  container.appendChild(box);
  const key = h("div", { className: "map-key" });
  key.append(withC(h("span", {}, "Start"), ACC), withC(h("span", {}, "Finish"), css("--fg")));
  container.appendChild(key);
  const api = { mark() {}, onHover: null };
  if (!window.maplibregl) { box.appendChild(h("div", { className: "note" }, "Map library failed to load")); return api; }

  const tilesB64 = (document.getElementById("maptiles")?.textContent || "").trim();
  if (tilesB64 && !pmtilesReady) {
    const bytes = Uint8Array.from(atob(tilesB64), (ch) => ch.charCodeAt(0));
    const protocol = new pmtiles.Protocol();
    maplibregl.addProtocol("pmtiles", protocol.tile);
    protocol.add(new pmtiles.PMTiles(new pmtiles.FileSource(new File([bytes], "area.pmtiles"))));
    pmtilesReady = true;
  }
  const style = { version: 8, sources: {}, layers: [{ id: "bg", type: "background", paint: { "background-color": css("--bg") } }] };
  if (pmtilesReady) {
    style.sources.protomaps = { type: "vector", url: "pmtiles://area.pmtiles",
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' };
    // No labels: they need font files from the network.
    style.layers = basemaps.layers("protomaps", basemaps.namedFlavor("dark"), { lang: "en" }).filter((l) => l.type !== "symbol");
  } else {
    box.appendChild(h("div", { className: "note" }, "No map yet: run health-map once"));
  }

  const idx = tr.lat.map((v, i) => v != null ? i : -1).filter((i) => i >= 0);
  const coords = idx.map((i) => [tr.lon[i], tr.lat[i]]);
  const lons = coords.map((c) => c[0]), lats = coords.map((c) => c[1]);
  let map;
  try {
    map = new maplibregl.Map({
      container: box, style, attributionControl: { compact: true }, dragRotate: false, pitchWithRotate: false,
      bounds: [[Math.min(...lons), Math.min(...lats)], [Math.max(...lons), Math.max(...lats)]],
      fitBoundsOptions: { padding: 40 },
    });
  } catch (e) {
    box.appendChild(h("div", { className: "note" }, "This browser can't draw the map (WebGL is off)"));
    return api;
  }
  openMap = map;
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");
  const pt = (c) => ({ type: "Feature", geometry: { type: "Point", coordinates: c } });
  let loaded = false;
  map.on("load", () => {
    map.addSource("route", { type: "geojson", data: { type: "Feature", geometry: { type: "LineString", coordinates: coords } } });
    map.addLayer({ id: "route-casing", type: "line", source: "route", layout: { "line-join": "round", "line-cap": "round" },
      paint: { "line-color": css("--bg"), "line-width": 8 } });
    map.addLayer({ id: "route", type: "line", source: "route", layout: { "line-join": "round", "line-cap": "round" },
      paint: { "line-color": ACC, "line-width": 4 } });
    map.addSource("ends", { type: "geojson", data: { type: "FeatureCollection", features: [
      { ...pt(coords[0]), properties: { c: ACC } }, { ...pt(coords[coords.length - 1]), properties: { c: css("--fg") } }] } });
    map.addLayer({ id: "ends", type: "circle", source: "ends",
      paint: { "circle-radius": 6, "circle-color": ["get", "c"], "circle-stroke-color": css("--surf"), "circle-stroke-width": 2 } });
    map.addSource("cursor", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
    map.addLayer({ id: "cursor", type: "circle", source: "cursor",
      paint: { "circle-radius": 7, "circle-color": css("--fg"), "circle-stroke-color": ACC, "circle-stroke-width": 3 } });
    loaded = true;
  });
  api.mark = (i) => {
    if (!loaded) return;
    const ok = i != null && tr.lat[i] != null;
    map.getSource("cursor").setData({ type: "FeatureCollection", features: ok ? [pt([tr.lon[i], tr.lat[i]])] : [] });
  };
  // Hovering the route moves the charts' crosshair too.
  map.on("mousemove", (e) => {
    if (!api.onHover) return;
    let best = -1, bd = 25 * 25;
    for (const i of idx) {
      const p = map.project([tr.lon[i], tr.lat[i]]);
      const d = (p.x - e.point.x) ** 2 + (p.y - e.point.y) ** 2;
      if (d < bd) { bd = d; best = i; }
    }
    api.onHover(best >= 0 ? best : null);
  });
  map.on("mouseout", () => api.onHover && api.onHover(null));
  return api;
}

// Stacked charts over distance or time, one crosshair for all of them.
function trackCharts(box, tr) {
  const walkRun = /running|walking|hiking/.test(tr.sport);
  const speed = smooth(tr.spd, 7);
  const defs = [
    { title: "Heart rate", unit: "bpm", v: tr.hr, f: (x) => fmt(x) },
    { title: "Pace", unit: "/mi", v: speed.map((s) => s != null && s > 0.4 ? MI / s : null), f: clock, invert: true, clip: true, time: true },
    { title: "Elevation", unit: "ft", v: tr.alt.map((a) => a == null ? null : a * FT), f: (x) => fmt(x), area: true },
    { title: "Cadence", unit: "spm", v: smooth(tr.cad, 4), f: (x) => fmt(x), clip: true },
    { title: "Power", unit: "W", v: smooth(tr.pwr, 4), f: (x) => fmt(x), clip: true },
    { title: "Stride length", unit: "in", v: smooth(tr.sl, 4).map((x) => x == null ? null : x / 25.4), f: (x) => fmt(x, 1), clip: true },
    { title: "Vertical oscillation", unit: "in", v: smooth(tr.vo, 4).map((x) => x == null ? null : x / 25.4), f: (x) => fmt(x, 1), clip: true },
    { title: "Ground contact time", unit: "ms", v: smooth(tr.gct, 4), f: (x) => fmt(x), clip: true },
  ].filter((d) => d.v.filter((x) => x != null).length >= 20 && (walkRun || !/Stride|Vertical|Ground/.test(d.title)));

  const hasDist = tr.dist.filter((x) => x != null).length > tr.t.length / 2;
  let mode = hasDist ? "dist" : "time";
  const xsOf = () => mode === "dist" ? tr.dist.map((d) => d == null ? null : d / MI) : tr.t.map((s) => s / 60);

  const bar = h("div", { className: "xmode" }, "Show over");
  const pills = h("div", { className: "pills" });
  const bD = h("button", {}, "Distance"), bT = h("button", {}, "Time");
  if (hasDist) pills.appendChild(bD);
  pills.appendChild(bT);
  bar.appendChild(pills);
  box.appendChild(bar);

  const charts = defs.map((d) => {
    const wrap = h("div", { className: "tchart" });
    const head = h("div", { className: "head" });
    const a = d.v.filter((x) => x != null);
    d.avgText = `average ${d.f(a.reduce((x, y) => x + y, 0) / a.length)} ${d.unit}`;
    d.readout = h("span", {}, d.avgText);
    head.append(h("b", {}, d.title), d.readout);
    d.plot = h("div", { className: "plot" });
    wrap.append(head, d.plot);
    box.appendChild(wrap);
    return d;
  });

  let cursor = null;
  const sync = (i) => {
    cursor = i;
    for (const d of charts) {
      d.mark?.(i);
      d.readout.textContent = i == null || d.v[i] == null ? d.avgText : `${d.f(d.v[i])} ${d.unit}`;
    }
    tr.map?.mark(i);
  };
  if (tr.map) tr.map.onHover = sync;

  const drawAll = () => {
    bD.setAttribute("aria-pressed", String(mode === "dist")); bT.setAttribute("aria-pressed", String(mode === "time"));
    const xs = xsOf();
    for (const d of charts) d.mark = drawTrack(d, xs, sync, mode);
    sync(cursor);
  };
  bD.addEventListener("click", () => { mode = "dist"; drawAll(); });
  bT.addEventListener("click", () => { mode = "time"; drawAll(); });
  requestAnimationFrame(drawAll);
}

function drawTrack(d, xs, sync, mode) {
  const plot = d.plot;
  plot.replaceChildren();
  const Wd = plot.clientWidth, Hd = plot.clientHeight;
  const m = { l: 48, r: 10, t: 8, b: 20 };
  const iw = Wd - m.l - m.r, ih = Hd - m.t - m.b;
  const svg = el("svg", { viewBox: `0 0 ${Wd} ${Hd}`, role: "img", "aria-label": d.title }, plot);
  const vals = d.v.filter((v) => v != null);
  // Spiky series (pace, cadence...) scale to the 2nd-98th percentile, so a
  // GPS glitch can't flatten the rest; the line is clipped at the edges.
  const mn = d.clip ? pct(d.v, 0.02) : Math.min(...vals), mx = d.clip ? pct(d.v, 0.98) : Math.max(...vals);
  // Times (pace) tick on clock-friendly steps: 15 s, 30 s, 1, 2 or 5 min.
  const step = d.time ? ([15, 30, 60, 120, 300].find((s) => s >= (mx - mn) / 4) ?? 600) : niceStep(mx - mn);
  const lo = Math.floor(mn / step) * step, hi = Math.max(lo + step, Math.ceil(mx / step) * step);
  const y = d.invert ? (v) => m.t + ((v - lo) / (hi - lo)) * ih : (v) => m.t + ih - ((v - lo) / (hi - lo)) * ih;
  const xmax = Math.max(...xs.filter((x) => x != null)) || 1;
  const x = (v) => m.l + (v / xmax) * iw;
  const clipId = "c" + Math.random().toString(36).slice(2);
  el("rect", { x: m.l, y: m.t, width: iw, height: ih }, el("clipPath", { id: clipId }, el("defs", {}, svg)));

  for (let v = lo; v <= hi + step / 1e6; v += step) {
    el("line", { x1: m.l, x2: m.l + iw, y1: y(v), y2: y(v), stroke: css("--line"), "stroke-width": 1, "stroke-dasharray": "2 4" }, svg);
    el("text", { x: m.l - 6, y: y(v) + 4, "text-anchor": "end" }, svg).textContent = d.f(v);
  }
  const xl = (v) => mode === "dist" ? `${fmt(v, 1)} mi` : clock(v * 60);
  [[0, "start"], [xmax / 2, "middle"], [xmax, "end"]].forEach(([v, a]) =>
    el("text", { x: x(v), y: Hd - 4, "text-anchor": a }, svg).textContent = xl(v));

  const surf = css("--surf");
  const segs = [];
  let seg = null;
  d.v.forEach((v, i) => {
    if (v == null || xs[i] == null) { seg = null; return; }
    if (!seg) segs.push(seg = []);
    seg.push([x(xs[i]), y(v)]);
  });
  const g = el("g", { "clip-path": `url(#${clipId})` }, svg);
  const base = m.t + ih;
  for (const sg of segs) {
    const line = sg.map(([px, py]) => `${px},${py}`).join("L");
    if (d.area) el("path", { d: `M${sg[0][0]},${base}L${line}L${sg[sg.length - 1][0]},${base}Z`, fill: ACC, "fill-opacity": 0.12 }, g);
    el("path", { d: "M" + line, fill: "none", stroke: ACC, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }, g);
  }

  const cross = el("line", { y1: m.t, y2: m.t + ih, stroke: css("--faint"), "stroke-width": 1, visibility: "hidden" }, svg);
  const dot = el("circle", { r: 4, fill: ACC, stroke: surf, "stroke-width": 2, visibility: "hidden" }, svg);
  const over = el("rect", { x: m.l, y: m.t, width: iw, height: ih, class: "hit", tabindex: 0 }, svg);
  const nearest = (px) => {
    // xs rises along the activity, so a binary search finds the closest point.
    const target = ((px - m.l) / iw) * xmax;
    let a = 0, b = xs.length - 1;
    while (a < b) { const c = (a + b) >> 1; if ((xs[c] ?? -1) < target) a = c + 1; else b = c; }
    return a;
  };
  over.addEventListener("pointermove", (e) => {
    const r = svg.getBoundingClientRect();
    sync(nearest((e.clientX - r.left) * (Wd / r.width)));
  });
  over.addEventListener("pointerleave", () => sync(null));
  let kb = 0;
  over.addEventListener("keydown", (e) => {
    const stepI = Math.max(1, Math.round(xs.length / 100));
    if (e.key === "ArrowLeft") kb = Math.max(0, kb - stepI); else if (e.key === "ArrowRight") kb = Math.min(xs.length - 1, kb + stepI); else return;
    e.preventDefault(); sync(kb);
  });
  over.addEventListener("blur", () => sync(null));

  return (i) => {
    const ok = i != null && xs[i] != null;
    cross.setAttribute("visibility", ok ? "visible" : "hidden");
    dot.setAttribute("visibility", ok && d.v[i] != null ? "visible" : "hidden");
    if (!ok) return;
    cross.setAttribute("x1", x(xs[i])); cross.setAttribute("x2", x(xs[i]));
    if (d.v[i] != null) { dot.setAttribute("cx", x(xs[i])); dot.setAttribute("cy", Math.max(m.t, Math.min(m.t + ih, y(d.v[i])))); }
  };
}

// Mile splits, computed from the recording.
function splitsTable(box, tr) {
  if (tr.dist.filter((x) => x != null).length < tr.t.length / 2) return;
  const rows = [];
  let s = 0, mile = 1;
  const close = (e) => {
    const miles = ((tr.dist[e] ?? 0) - (tr.dist[s] ?? 0)) / MI;
    if (miles < 0.05) return;
    const secs = tr.t[e] - tr.t[s];
    const hr = tr.hr.slice(s, e + 1).filter((v) => v != null);
    const cad = tr.cad.slice(s, e + 1).filter((v) => v != null);
    let up = 0, down = 0;
    for (let i = s + 1; i <= e; i++) if (tr.alt[i] != null && tr.alt[i - 1] != null) {
      const dh = tr.alt[i] - tr.alt[i - 1]; if (dh > 0) up += dh; else down -= dh;
    }
    rows.push([miles >= 0.995 ? String(rows.length + 1) : `${rows.length + 1} (${fmt(miles, 2)} mi)`,
      clock(secs), clock(secs / miles) + " /mi",
      hr.length ? fmt(mean(hr)) + " bpm" : "–",
      `+${fmt(up * FT)} / −${fmt(down * FT)} ft`,
      cad.length ? fmt(mean(cad)) + " spm" : "–"]);
    s = e;
  };
  tr.dist.forEach((d, i) => { if (d != null && d >= mile * MI) { close(i); mile++; } });
  close(tr.dist.length - 1);
  if (!rows.length) return;
  box.appendChild(h("div", { className: "section" }, "Splits"));
  const t = h("table"), head = h("tr");
  ["Mile", "Time", "Pace", "Avg heart rate", "Climb / descent", "Cadence"].forEach((x) => head.appendChild(h("th", {}, x)));
  t.appendChild(head);
  for (const r of rows) { const row = h("tr"); r.forEach((x) => row.appendChild(h("td", {}, x))); t.appendChild(row); }
  const wrap = h("div", { className: "table-wrap" }); wrap.appendChild(t);
  box.appendChild(wrap);
}

// The watch's own laps (lap button or auto-lap).
function lapsTable(box, tr) {
  const walkRun = /running|walking|hiking/.test(tr.sport);
  box.appendChild(h("div", { className: "section" }, "Laps"));
  const t = h("table"), head = h("tr");
  ["Lap", "Distance", "Time", "Pace", "Avg heart rate", "Max heart rate", "Climb", "Cadence"].forEach((x) => head.appendChild(h("th", {}, x)));
  t.appendChild(head);
  tr.laps.forEach((l, i) => {
    const row = h("tr");
    [String(i + 1), l.dist ? fmt(l.dist / MI, 2) + " mi" : "–", l.time ? clock(l.time) : "–",
      l.spd ? clock(MI / l.spd) + " /mi" : "–", l.hr ? fmt(l.hr) + " bpm" : "–", l.maxhr ? fmt(l.maxhr) + " bpm" : "–",
      l.up != null ? fmt(l.up * FT) + " ft" : "–",
      // FIT counts one foot; Garmin shows steps per minute for walking and running.
      l.cad ? fmt(walkRun ? l.cad * 2 : l.cad) + (walkRun ? " spm" : " rpm") : "–",
    ].forEach((x) => row.appendChild(h("td", {}, x)));
    t.appendChild(row);
  });
  const wrap = h("div", { className: "table-wrap" }); wrap.appendChild(t);
  box.appendChild(wrap);
}

// ---- Page ---------------------------------------------------------------
document.getElementById("sub").textContent = [D.device, D.exported && `phone export ${D.exported}`,
  DAYS.length && `${longDay(numDay(firstDn))} to ${longDay(numDay(lastDn))}`, `${W.length} workouts`].filter(Boolean).join(" · ");
today();
recent();
week();
renderCharts();
calendar();
records();
workoutList();
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(renderCharts, 100); });
</script>
