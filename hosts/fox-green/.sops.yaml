# Who can decrypt fox-green's secrets: your workstation and fox-green. Not
# fox-red, so neither server can read the other's.
#
# Fill both in before the first ./secret.sh fox-green ...:
#   workstation: the workstation key from hosts/fox-red/.sops.yaml (the one
#                that isn't fox-red's: compare with
#                ssh fox-red cat /etc/ssh/ssh_host_ed25519_key.pub | nix run nixpkgs#ssh-to-age)
#   fox-green:   ssh-keyscan -t ed25519 <fox-green's public IP> | nix run nixpkgs#ssh-to-age
#                (after nixos-infect, which keeps the host key from then on)
creation_rules:
  - path_regex: ^secrets/
    key_groups:
      - age:
          - age17pt5w706p9xlp7qytmwwuf3jpncre7vls5a4uyqsykwlpgx4n5kslw957h
          - age1evkuplyzmj2dstgnqvlvnt3dpkg2m8t2n73rjhjnxn00hfp7rf6qzmgf8d
